<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EYE C U — Pro Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; padding:0; height:100%; font-family:'Jost',sans-serif; background:#faf8f5; }
    .portal-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 6vw;
      background:#fff;
      border-bottom:1px solid rgba(0,0,0,0.08);
    }
    .portal-bar a {
      font-size:0.82rem; color:#6B1E2E; text-decoration:none;
      letter-spacing:0.06em; transition:opacity .2s ease;
    }
    .portal-bar a:hover { opacity:0.7; }
    .portal-bar .back::before { content:'← '; }
    .portal-bar .brand {
      font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase;
      color:#767676;
    }
    iframe {
      width:100%; height:calc(100vh - 45px); border:0; display:block;
    }
  </style>
</head>
<body>
  <div class="portal-bar">
    <a href="/en/" class="back">Back to site</a>
    <span class="brand">EYE C U®</span>
  </div>
  <iframe src="https://script.google.com/macros/s/AKfycbzaUAKcNNglhK6bM6zcR5XS2qBQ6-7V7kbveEvlzlcJBYXxSN0vIlFspXvwU2q0ptqV-g/exec?mode=catalog"
          allow="clipboard-write"></iframe>
</body>
</html>
